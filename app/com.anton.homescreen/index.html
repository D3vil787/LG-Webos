<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
    background: #090b13 url(bg.jpg) no-repeat 0 0;
  }

  .glass {
    position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.07) 55%, rgba(255,255,255,0.04) 100%);
    border: 2px solid rgba(255,255,255,0.22);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.35);
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
  }
  .glass:before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 55%;
    border-radius: inherit;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.16), rgba(255,255,255,0.05) 45%, rgba(255,255,255,0) 100%);
  }

  #clock {
    position: absolute;
    top: 44px;
    right: 60px;
    padding: 12px 30px;
    border-radius: 40px;
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 2px;
  }

  #tiles {
    position: absolute;
    top: 390px;
    left: 0;
    width: 1920px;
    height: 320px;
    display: -webkit-box;
    -webkit-box-pack: center;
    -webkit-box-align: center;
  }
  .tile {
    width: 420px;
    height: 280px;
    margin: 0 34px;
    border-radius: 48px;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-box-pack: center;
    -webkit-box-align: center;
    -webkit-transform: translateZ(0) scale(1);
    -webkit-transition: -webkit-transform 120ms ease-out;
  }
  .tile.focused {
    -webkit-transform: translateZ(0) scale(1.07);
    background: linear-gradient(160deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.14) 55%, rgba(255,255,255,0.08) 100%);
    border: 3px solid rgba(255,255,255,0.9);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.6);
  }

  .glyph img {
    position: absolute;
    left: 0;
    top: 0;
    width: 120px;
    height: 120px;
    border-radius: 30px;
  }
  .glyph {
    position: relative;
    overflow: hidden;
    width: 120px;
    height: 120px;
    margin-bottom: 22px;
    border-radius: 30px;
    display: -webkit-box;
    -webkit-box-pack: center;
    -webkit-box-align: center;
    font-size: 44px;
    font-weight: bold;
    color: #ffffff;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.45);
  }
  .glyph.kp    { background: linear-gradient(160deg, #ffa040, #ff5a00); }
  .glyph.lampa { background: linear-gradient(160deg, #7cd4ff, #2f86ff); }
  .glyph.yt    { background: linear-gradient(160deg, #ff7a7a, #e01818); }

  .label {
    position: relative;
    font-size: 32px;
    letter-spacing: 1px;
  }

  #hint {
    position: absolute;
    left: 0;
    width: 1920px;
    top: 800px;
    text-align: center;
    font-size: 22px;
    color: rgba(255,255,255,0.45);
  }

  #status {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 48px;
    font-size: 22px;
    color: rgba(255,255,255,0.6);
  }
</style>
<script src="icons.js"></script>
<script>
  function iconLoaded(img, key) {
    var c = (window.ICON_COLORS && ICON_COLORS[key]) || "#1d1f20";
    img.parentNode.style.background = c;
  }
</script>
</head>
<body>
  <div id="clock" class="glass">--:--</div>

  <div id="tiles">
    <div class="tile glass" id="tile0" data-app="com.685631.3411">
      <div class="glyph kp">K<img src="icon_kp.png" onload="iconLoaded(this,'kp')" onerror="this.style.display='none'"></div>
      <div class="label">Кинопоиск</div>
    </div>
    <div class="tile glass" id="tile1" data-app="lampa.tv">
      <div class="glyph lampa">L<img src="icon_lampa.png" onload="iconLoaded(this,'lampa')" onerror="this.style.display='none'"></div>
      <div class="label">Lampa</div>
    </div>
    <div class="tile glass" id="tile2" data-app="youtube.leanback.v4">
      <div class="glyph yt">Y<img src="icon_yt.png" onload="iconLoaded(this,'yt')" onerror="this.style.display='none'"></div>
      <div class="label">YouTube</div>
    </div>
  </div>

  <div id="hint">Все приложения — кнопка Home на пульте</div>

  <div id="status"></div>

  <script>
    function pad(n) { n = n + ""; return n.length < 2 ? "0" + n : n; }

    function updateClock() {
      var d = new Date();
      document.getElementById("clock").innerHTML = pad(d.getHours()) + ":" + pad(d.getMinutes());
    }
    updateClock();
    setInterval(updateClock, 15000);

    var bridges = [];
    function setStatus(t) { document.getElementById("status").innerHTML = t; }

    function launchApp(appId) {
      setStatus("");
      try {
        var bridge = new PalmServiceBridge();
        bridges.push(bridge);
        bridge.onservicecallback = function (msg) {
          try {
            var res = JSON.parse(msg);
            if (!res.returnValue) { setStatus("Не удалось запустить: " + (res.errorText || msg)); }
          } catch (e) {}
        };
        bridge.call(
          "luna://com.webos.applicationManager/launch",
          JSON.stringify({ id: appId })
        );
      } catch (e) {
        setStatus("Exception: " + e);
      }
    }

    var tiles = [
      document.getElementById("tile0"),
      document.getElementById("tile1"),
      document.getElementById("tile2")
    ];
    var tileIndex = 0;

    function focusTile(next) {
      tiles[tileIndex].className = "tile glass";
      tileIndex = next;
      tiles[tileIndex].className = "tile glass focused";
    }
    tiles[0].className = "tile glass focused";

    document.addEventListener("keydown", function (e) {
      var key = e.keyCode;
      if (key === 37) {
        if (tileIndex > 0) { focusTile(tileIndex - 1); }
      } else if (key === 39) {
        if (tileIndex < tiles.length - 1) { focusTile(tileIndex + 1); }
      } else if (key === 13) {
        launchApp(tiles[tileIndex].getAttribute("data-app"));
      }
    });
  </script>
</body>
</html>
